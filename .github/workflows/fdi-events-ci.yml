name: FDI event platform checks
on:
  pull_request:
    paths: ['fdi-events/**', '.github/workflows/fdi-events-ci.yml']
  push:
    branches: ['main']
    paths: ['fdi-events/**', '.github/workflows/fdi-events-ci.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdi-events
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fdi-events/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx wrangler deploy --dry-run
